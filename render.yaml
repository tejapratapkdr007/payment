services:
  - type: web
    name: class-payment-tracker-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: class-payment-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://class-payment-tracker.onrender.com
      - key: PUBLIC_APP_URL
        value: https://class-payment-tracker.onrender.com
      # Set these manually in the Render dashboard after first deploy:
      # CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET,
      # SEED_TEACHER_EMAIL, SEED_TEACHER_PASSWORD, SEED_TEACHER_NAME

  - type: web
    name: class-payment-tracker
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://class-payment-tracker-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: class-payment-tracker-db
    plan: free
